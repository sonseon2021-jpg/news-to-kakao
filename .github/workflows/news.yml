name: 단독 뉴스 카톡 전송

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 실행 (UTC 기준, GitHub Actions 특성상 실제로는 몇 분씩 지연될 수 있음)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

concurrency:
  group: news-to-kakao-run
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존 패키지 설치
        run: pip install requests

      - name: 스크립트 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python main.py

      - name: 전송 기록(sent_links.json) 저장소에 반영
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add sent_links.json
          git diff --staged --quiet || git commit -m "update sent links"
          git pull --rebase origin main
          git push
